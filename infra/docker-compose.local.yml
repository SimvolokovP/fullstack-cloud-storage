services:
  postgres:
    image: postgres:16-alpine
    container_name: cloud-box-db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - cloud-box-network

  redis:
    image: redis:7-alpine
    container_name: cloud-box-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redisdata:/data
    networks:
      - cloud-box-network

  minio:
    image: minio/minio:latest
    container_name: cloud-box-s3
    restart: always
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    command: server /data --console-address ":9001"
    networks:
      - cloud-box-network

  minio-create-bucket:
    image: minio/mc:latest
    container_name: cloud-box-s3-init
    depends_on:
      - minio
    entrypoint: >
      sh -c "
      until (/usr/bin/mc alias set local_minio http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY}) do echo 'Waiting for MinIO...' && sleep 1; done;
      if ! /usr/bin/mc ls local_minio/${S3_BUCKET_NAME} > /dev/null 2>&1; then
        /usr/bin/mc mb local_minio/${S3_BUCKET_NAME};
        /usr/bin/mc policy set public local_minio/${S3_BUCKET_NAME};
      fi;
      exit 0;
      "
    networks:
      - cloud-box-network

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: cloud-box-backend
    restart: always
    ports:
      - "${APPLICATION_PORT}:${APPLICATION_PORT}"
    environment:
      NODE_ENV: ${NODE_ENV}
      APPLICATION_PORT: ${APPLICATION_PORT}
      APPLICATION_URL: ${APPLICATION_URL}
      ALLOWED_ORIGIN: ${ALLOWED_ORIGIN}
      COOKIES_SECRET: ${COOKIES_SECRET}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_NAME: ${SESSION_NAME}
      SESSION_DOMAIN: ${SESSION_DOMAIN}
      SESSION_MAX_AGE: ${SESSION_MAX_AGE}
      SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY}
      SESSION_SECURE: ${SESSION_SECURE}
      SESSION_FOLDER: ${SESSION_FOLDER}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_USER}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      REDIS_URI: redis://:${REDIS_PASSWORD}@redis:6379
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USER: ${MAIL_USER}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      MAIL_FROM: ${MAIL_FROM}
      GOOGLE_RECAPTCHA_SECRET_KEY: ${GOOGLE_RECAPTCHA_SECRET_KEY}
      YANDEX_CLIENT_ID: ${YANDEX_CLIENT_ID}
      YANDEX_CLIENT_SECRET: ${YANDEX_CLIENT_SECRET}
      YANDEX_CALLBACK_URL: ${YANDEX_CALLBACK_URL}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      S3_REGION: ${S3_REGION}
      ADMIN_DEFAULT_EMAIL: ${ADMIN_DEFAULT_EMAIL}
      ADMIN_DEFAULT_PASSWORD: ${ADMIN_DEFAULT_PASSWORD}
    depends_on:
      - postgres
      - redis
      - minio
    networks:
      - cloud-box-network

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: cloud-box-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      GOOGLE_RECAPTCHA_SITE_KEY: ${GOOGLE_RECAPTCHA_SITE_KEY}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend
    networks:
      - cloud-box-network

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  cloud-box-network:
    driver: bridge
